name: CI

on:
  pull_request:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_browsers:
        description: Run Firefox and WebKit release gates too
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  source:
    name: Source checks and packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify source, types, tests, rules, and build
        run: pnpm check
      - name: Package theme and UI tarballs
        run: |
          mkdir -p artifacts
          pnpm --filter @cqu-moe/theme pack --pack-destination "$PWD/artifacts"
          pnpm --filter @cqu-moe/ui pack --pack-destination "$PWD/artifacts"
          cd artifacts && sha256sum *.tgz > SHA256SUMS
      - name: Upload main package tarballs
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cqu-moe-design-packages
          path: |
            artifacts/*.tgz
            artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
      - name: Upload main preview build
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cqu-moe-design-preview-dist
          path: apps/preview/dist
          if-no-files-found: error
          retention-days: 14

  browser:
    name: Chromium design gates
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run the Cloudflare source and browser gate without root
        run: bash scripts/build-cloudflare.sh
      - name: Verify assertion, network and zero-test failures
        run: pnpm test:e2e:harness
      - name: Upload browser reports
        if: always() && !cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cqu-moe-design-browser-reports
          path: |
            artifacts/e2e
          if-no-files-found: error
          retention-days: 7

  release-browsers:
    name: Firefox and WebKit release gates
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_browsers == true
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install release browsers
        run: pnpm exec playwright install --with-deps firefox webkit
      - name: Verify release browsers against a production build
        run: node scripts/run-browser-tests.mjs --project=firefox-desktop --project=webkit-desktop
      - name: Upload release browser reports
        if: always() && !cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cqu-moe-design-release-browser-reports
          path: artifacts/e2e
          if-no-files-found: error
          retention-days: 7

  ci-result:
    name: CI result
    needs:
      - source
      - browser
      - release-browsers
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every CI job to pass
        env:
          SOURCE_RESULT: ${{ needs.source.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          RELEASE_BROWSER_RESULT: ${{ needs.release-browsers.result }}
          REQUIRE_RELEASE_BROWSERS: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.release_browsers == true }}
        run: |
          test "$SOURCE_RESULT" = success
          test "$BROWSER_RESULT" = success
          if [ "$REQUIRE_RELEASE_BROWSERS" = true ]; then
            test "$RELEASE_BROWSER_RESULT" = success
          else
            test "$RELEASE_BROWSER_RESULT" = skipped
          fi

  release:
    name: Immutable tag packages
    needs: ci-result
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate package versions and main ancestry
        run: |
          version="${GITHUB_REF_NAME#v}"
          node --input-type=module - "$version" <<'NODE'
          import { readFile } from "node:fs/promises";
          const expected = process.argv[2];
          const packages = {
            "packages/theme/package.json": "version",
            "packages/ui/package.json": "version",
          };
          for (const [path, field] of Object.entries(packages)) {
            const pkg = JSON.parse(await readFile(path, "utf8"));
            if (pkg[field] !== expected) {
              throw new Error(`${path} ${field} is ${pkg[field]}; expected ${expected}`);
            }
          }
          const template = JSON.parse(
            await readFile("templates/app/package.json", "utf8"),
          );
          for (const name of ["@cqu-moe/theme", "@cqu-moe/ui"]) {
            if (template.dependencies[name] !== expected) {
              throw new Error(`templates/app dependency ${name} is ${template.dependencies[name]}; expected ${expected}`);
            }
          }
          NODE
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Build and package release tarballs
        run: |
          pnpm build
          mkdir -p artifacts
          pnpm --filter @cqu-moe/theme pack --pack-destination "$PWD/artifacts"
          pnpm --filter @cqu-moe/ui pack --pack-destination "$PWD/artifacts"
          cd artifacts && sha256sum *.tgz > SHA256SUMS
      - name: Create immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          This release contains @cqu-moe/theme and @cqu-moe/ui tarballs plus SHA-256 checksums.

          The same tag workflow reran non-browser checks, browser E2E, and installed-tarball consumer verification before publishing. These assets are not published to npm.
          NOTES
          gh release create "$GITHUB_REF_NAME" \
            artifacts/cqu-moe-theme-*.tgz \
            artifacts/cqu-moe-ui-*.tgz \
            artifacts/SHA256SUMS \
            --verify-tag \
            --title "CQU Moe Design ${GITHUB_REF_NAME}" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
